name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_TO_EMAIL: ${{ secrets.VITE_EMAILJS_TO_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
          VITE_SCHEDULE_MEETING_URL: ${{ secrets.VITE_SCHEDULE_MEETING_URL }}
          VITE_CHAT_API_URL: ${{ secrets.VITE_CHAT_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify production index.html
        run: |
          grep -qE '/assets/index-[^"]+\.js' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -q '__OG_IMAGE_URL__' dist/index.html

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll (ensure static files are served as built)
        run: touch dist/.nojekyll

      - name: Deploy built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Verify GitHub Pages serves built assets (not main branch source)
        run: |
          html=$(curl -fsSL "https://elite-mob.github.io/")
          if echo "$html" | grep -q '/src/main.tsx'; then
            echo "::error::GitHub Pages is serving source files from main, not the built site on gh-pages."
            echo "Fix once: Repository → Settings → Pages → Deploy from a branch → gh-pages / (root)"
            echo "View Page Source should show /assets/index-*.js, not /src/main.tsx."
            exit 1
          fi
          if ! echo "$html" | grep -qE '/assets/index-[^"]+\.js'; then
            echo "::error::Live site HTML does not reference a built JS bundle. Check Pages source branch."
            exit 1
          fi
          echo "Live site serves production bundle."
