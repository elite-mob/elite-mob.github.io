name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_TO_EMAIL: ${{ secrets.VITE_EMAILJS_TO_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
          VITE_SCHEDULE_MEETING_URL: ${{ secrets.VITE_SCHEDULE_MEETING_URL }}
          VITE_CHAT_API_URL: ${{ secrets.VITE_CHAT_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify production index.html
        run: |
          grep -qE '/assets/index-[^"]+\.js' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -q '__OG_IMAGE_URL__' dist/index.html

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll (ensure static files are served as built)
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site serves built assets
        run: |
          for attempt in 1 2 3 4 5; do
            sleep 15
            html=$(curl -fsSL "https://elite-mob.github.io/" || true)
            if echo "$html" | grep -qE '/assets/index-[^"]+\.js'; then
              echo "Live site serves production bundle (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: still waiting for production bundle..."
          done
          echo "::error::Live site still serves source files from main, not the built dist/."
          echo "Fix once: https://github.com/${{ github.repository }}/settings/pages"
          echo "  Source → GitHub Actions (not Deploy from a branch → main)"
          echo "Then re-run this workflow. View Page Source should show /assets/index-*.js."
          exit 1
