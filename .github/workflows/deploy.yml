name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      index_bundle: ${{ steps.bundle.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_TO_EMAIL: ${{ secrets.VITE_EMAILJS_TO_EMAIL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
          VITE_SCHEDULE_MEETING_URL: ${{ secrets.VITE_SCHEDULE_MEETING_URL }}
          VITE_CHAT_API_URL: ${{ secrets.VITE_CHAT_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Verify production index.html
        run: |
          grep -qE '/assets/index-[^"]+\.js' dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -q '__OG_IMAGE_URL__' dist/index.html

      - name: Verify vendor chunks have no circular imports
        run: |
          react_vendor=$(ls dist/assets/react-vendor-*.js | head -1)
          if grep -q 'ui-vendor' "$react_vendor"; then
            echo "::error::react-vendor chunk imports ui-vendor (breaks React.forwardRef at runtime)."
            exit 1
          fi
          if ls dist/assets/ui-vendor-*.js >/dev/null 2>&1; then
            echo "::error::ui-vendor chunk should not be emitted; bundle Radix with react-vendor."
            exit 1
          fi

      - name: Record index bundle name
        id: bundle
        run: echo "name=$(grep -oE 'index-[^"]+\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll (ensure static files are served as built)
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site serves this deployment
        run: |
          expected="${{ needs.build.outputs.index_bundle }}"
          for attempt in 1 2 3 4 5; do
            sleep 15
            html=$(curl -fsSL "https://elite-mob.github.io/" || true)
            if echo "$html" | grep -q '/src/main.tsx'; then
              echo "Attempt $attempt: still serving source index.html from main..."
              continue
            fi
            live=$(echo "$html" | grep -oE 'index-[^"]+\.js' | head -1)
            if [ "$live" = "$expected" ]; then
              react=$(echo "$html" | grep -oE 'react-vendor-[^"]+\.js' | head -1)
              if curl -fsSL "https://elite-mob.github.io/assets/$react" | grep -q 'ui-vendor'; then
                echo "::error::Live react-vendor still imports ui-vendor (stale or broken deploy)."
                exit 1
              fi
              echo "Live site serves deployed bundle $live (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: expected $expected, live has ${live:-none}..."
          done
          echo "::error::Live site did not pick up bundle $expected."
          echo "Check Settings → Pages → Source is GitHub Actions, then re-run this workflow."
          exit 1
